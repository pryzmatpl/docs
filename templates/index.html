<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Knowledge Base Query</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .query-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .result-card {
            border-left: 4px solid #007bff;
            margin-bottom: 15px;
        }
        .similarity-badge {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        .loading {
            display: none;
        }
        .metadata-info {
            font-size: 0.9em;
            color: #6c757d;
        }
        .content-text {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            line-height: 1.6;
        }
        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        .btn-ingest {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
        }
        .btn-ingest:hover {
            background: linear-gradient(45deg, #ee5a24, #ff6b6b);
            color: white;
        }
    </style>
</head>
<body>
    <div class="header-section">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <h1><i class="fas fa-search"></i> Semantic Knowledge Base</h1>
                    <p class="mb-0">Query your document collection using natural language</p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-ingest" onclick="triggerIngestion()">
                        <i class="fas fa-upload"></i> Trigger Ingestion
                    </button>
                    <a href="/history" class="btn btn-outline-light ms-2">
                        <i class="fas fa-history"></i> Query History
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="query-container">
            <form id="queryForm">
                <div class="mb-4">
                    <label for="queryInput" class="form-label">
                        <i class="fas fa-question-circle"></i> Enter your query:
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control form-control-lg" id="queryInput" 
                               name="query" placeholder="Ask anything about your documents..." required>
                        <button class="btn btn-primary btn-lg" type="submit">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </div>
            </form>

            <div class="loading text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Searching...</span>
                </div>
                <p class="mt-2">Searching for relevant content...</p>
            </div>

            <div id="results" class="mt-4"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('queryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            performQuery();
        });

        function performQuery() {
            const queryInput = document.getElementById('queryInput');
            const query = queryInput.value.trim();
            
            if (!query) {
                alert('Please enter a query');
                return;
            }

            // Show loading
            document.querySelector('.loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            // Perform the query
            fetch('/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `query=${encodeURIComponent(query)}`
            })
            .then(response => response.json())
            .then(data => {
                document.querySelector('.loading').style.display = 'none';
                
                if (data.error) {
                    document.getElementById('results').innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> Error: ${data.error}
                        </div>
                    `;
                    return;
                }

                displayResults(data);
            })
            .catch(error => {
                document.querySelector('.loading').style.display = 'none';
                document.getElementById('results').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i> Error: ${error.message}
                    </div>
                `;
            });
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (data.results.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> No relevant documents found for your query.
                    </div>
                `;
                return;
            }

            let html = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> Found ${data.total_results} relevant document chunks for: "${data.query_text}"
                </div>
            `;

            data.results.forEach((result, index) => {
                const similarityPercent = Math.round(result.similarity_score * 100);
                html += `
                    <div class="card result-card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fas fa-file-alt"></i> ${result.doc_id} - Chunk ${result.chunk_index + 1}
                            </h5>
                            <span class="similarity-badge">
                                ${similarityPercent}% match
                            </span>
                        </div>
                        <div class="card-body">
                            <div class="metadata-info">
                                <i class="fas fa-info-circle"></i> 
                                Source: ${result.metadata.source || 'Unknown'} | 
                                Page: ${result.metadata.page || 'N/A'} | 
                                Document ID: ${result.doc_id}
                            </div>
                            <div class="content-text">
                                ${result.content}
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function triggerIngestion() {
            if (!confirm('This will trigger document ingestion. Continue?')) {
                return;
            }

            const button = document.querySelector('.btn-ingest');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            button.disabled = true;

            fetch('/ingest', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || data.error || 'Ingestion completed');
            })
            .catch(error => {
                alert('Error during ingestion: ' + error.message);
            })
            .finally(() => {
                button.innerHTML = originalText;
                button.disabled = false;
            });
        }
    </script>
</body>
</html>
