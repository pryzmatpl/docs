version: "3.8"
services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/vector_extension.sql:/docker-entrypoint-initdb.d/0-vector_extension.sql
      - ./migrations/init_01.sql:/docker-entrypoint-initdb.d/1-init_01.sql
      - ./migrations/init_02.sql:/docker-entrypoint-initdb.d/2-init_02.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crewai_db

  crewai-extraction:
    build:
      context: .
      dockerfile: Dockerfile.crewai
    volumes:
      - ./docs:/app/docs
      - ./.env:/app/.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
    restart: "no"

  query-app:
    build:
      context: .
      dockerfile: Dockerfile.query
    ports:
      - "50505:50505"
    volumes:
      - ./docs:/app/docs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: